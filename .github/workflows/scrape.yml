name: scrape

# Git-scrape the Western Power outage feed and commit a snapshot when the map
# changes. Publishing the viewer is a separate workflow (publish.yml) that this
# job dispatches only when there's a new snapshot — so a slow/stuck Pages deploy
# can never queue up behind (and time out) the next scrape.
#
# Cadence note: the feed changes ~every 26-90 min, and GitHub's scheduler drops
# most fires on an aggressive cron anyway, so */20 loses no real freshness while
# keeping the run queue clear.
on:
  schedule:
    - cron: "*/20 * * * *"     # every 20 minutes (GitHub may still delay under load)
  workflow_dispatch: {}

permissions:
  contents: write              # push snapshot commits
  actions: write               # dispatch publish.yml when data changes

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10           # a wedged fetch shouldn't hold the queue for 6h
    steps:
      - uses: actions/checkout@v5   # shallow is fine — we only diff/commit current.geojson

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scrape and commit snapshot (only if changed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scrape.py
          if git diff --quiet -- data/current.geojson; then
            echo "no change in outage map; nothing to publish"
            exit 0
          fi

          count=$(python3 -c "import json;print(len(json.load(open('data/current.geojson'))['features']))")
          git config user.name  "outage-scraper[bot]"
          git config user.email "actions@github.com"
          git add data/current.geojson
          git commit -m "snapshot: ${count} outages @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Rebase-and-retry: the hourly publish doesn't push, but a manual commit
          # or an overlapping dispatch can still land first.
          for i in 1 2 3; do
            git push && break
            echo "push rejected (attempt $i); rebasing on origin/main"
            git pull --rebase --autostash origin main
            sleep $((i * 5))
          done

          # A GITHUB_TOKEN push does NOT fire on:push workflows, so dispatch explicitly.
          # GitHub's API 503s occasionally; retry, and if it still fails don't fail the
          # job — the snapshot is already committed and publish.yml self-heals hourly.
          for i in 1 2 3; do
            if gh workflow run publish.yml; then exit 0; fi
            echo "publish dispatch failed (attempt $i)"
            sleep $((i * 10))
          done
          echo "::warning::could not dispatch publish.yml; hourly run will pick this up"
