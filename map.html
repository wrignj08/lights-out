<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Lights Out — WA Power Outage History</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f5c518' d='M13 2L4 14h6l-1 8l9-12h-6z'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --bg:#eef2f6; --panel:#ffffff; --ink:#1a2230; --muted:#5b6b7c;
          --unplanned:#ff5a3c; --planned:#3b9dff; --accent:#0f9d77; --line:#d4dbe3;
          --mapbg:#dfe5ec; --field:#ffffff; --btn:#eef2f6; --btn-hover:#e1e7ee;
          /* iOS: the map is drawn this much taller than the large viewport so its
             tiles paint behind/around Safari's translucent URL bar with no gap.
             0 on desktop; bumped on mobile (see the mobile media query). */
          --mobile-browser-chrome-overscan:0px; }
  /* Auto dark mode — follows the OS/browser theme via prefers-color-scheme. */
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e151f; --panel:#19222e; --ink:#e6ecf3; --muted:#9fb0c2;
            --unplanned:#ff6b50; --planned:#4aa8ff; --accent:#1ec08f; --line:#2c3a4d;
            --mapbg:#0c1118; --field:#222d3d; --btn:#222d3d; --btn-hover:#2c3a4d; }
  }
  html,body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  html { height:100%; }
  /* 100lvh = the LARGE viewport (as if the URL bar is retracted), so the page
     extends behind iOS Safari's translucent bottom bar instead of stopping above it. */
  body { height:100lvh; overflow:hidden; overscroll-behavior:none; }
  /* Map drawn taller than the viewport by the overscan so its tiles fill the
     whole area under + around the URL bar (no blank strip). */
  #map { position:absolute; top:0; left:0; width:100%;
         height:calc(100lvh + var(--mobile-browser-chrome-overscan)); background:var(--mapbg); }
  /* Leaflet anchors bottom controls to the (overscanned) map, so lift them back
     above the URL-bar zone + home indicator. 100lvh-100dvh = the URL bar height
     when shown, 0 when hidden; resolves to 0 on desktop. */
  .leaflet-bottom { bottom:calc(var(--mobile-browser-chrome-overscan) + 100lvh - 100dvh + env(safe-area-inset-bottom, 0px)); }
  .panel { background:var(--panel); color:var(--ink); border:1px solid var(--line);
           border-radius:12px; box-shadow:0 6px 22px rgba(20,40,70,.18); }
  /* Top bar spans the width; all Leaflet controls live at the BOTTOM so nothing
     sits behind this bar (fixes the zoom-control overlap). */
  #controls { position:absolute; z-index:1000;
              top:calc(12px + env(safe-area-inset-top, 0px));
              left:calc(12px + env(safe-area-inset-left, 0px));
              right:calc(12px + env(safe-area-inset-right, 0px));
              padding:10px 16px; display:flex; flex-direction:column; gap:8px; }
  #topline { display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px; }
  #title { font-weight:700; font-size:15px; letter-spacing:.2px; }
  .ver { font-size:11px; color:var(--muted); font-weight:500; margin-left:auto; }
  /* Time / Heatmap tabs (mutually exclusive); panelArea has a fixed height so
     the top bar never changes size when switching modes. */
  .tabs { display:inline-flex; align-self:flex-start; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .tab { background:var(--panel); color:var(--muted); border:none; padding:4px 14px; font-size:12px; cursor:pointer; }
  .tab.active { background:var(--accent); color:#fff; }
  #panelArea { height:66px; display:flex; align-items:center; }
  #panelArea > div { width:100%; }
  .stat { font-size:13px; color:var(--muted); }
  .stat b { color:var(--ink); font-variant-numeric:tabular-nums; }
  /* the min-width is set from the dataset's peak values in buildSeries() so the
     line doesn't reflow as the live counters tick during playback */
  #n, #cust { display:inline-block; text-align:right; }
  .timerow { display:flex; align-items:center; gap:10px; }
  /* slider + sparkline stacked in one column so they share the exact width */
  .timecol { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  #tlabel { font-size:12px; color:var(--ink); min-width:172px; text-align:right; font-variant-numeric:tabular-nums; }
  button#play { background:var(--btn); color:var(--ink); border:1px solid var(--line);
                border-radius:8px; padding:5px 0; font-size:18px; line-height:1; cursor:pointer;
                box-sizing:border-box; width:38px;
                display:inline-flex; align-items:center; justify-content:center; }
  button#play:hover { background:var(--btn-hover); }
  /* range styled with a known 14px thumb so its 7px travel-inset is predictable */
  input[type=range]#slider { -webkit-appearance:none; appearance:none; width:100%; height:6px;
                margin:0; background:transparent; border-radius:3px; cursor:pointer; }
  #slider::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
                background:var(--accent); border:none; }
  #slider::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:var(--accent); border:none; }
  #spark { display:block; width:100%; height:46px; cursor:crosshair; }
  #sparkcap { font-size:10px; color:var(--muted); }
  /* heatmap controls */
  .heatrow { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; font-size:12px; color:var(--muted);
             border-top:1px solid var(--line); padding-top:8px; }
  .heatgroup { display:flex; align-items:center; gap:7px; }
  .heatlbl { font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:var(--muted); }
  .heatrow input[type=date], .daterange input[type=date] {
             font-size:12px; padding:3px 6px; border:1px solid var(--line); border-radius:6px;
             background:var(--field); color:var(--ink); font-family:inherit; }
  /* tabs + the shared date range share one row (range serves both modes) */
  .tabsrow { display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px; }
  .heatarrow { color:var(--muted); }
  /* segmented control (shared by the metric toggle + quick-range presets) */
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .segbtn { background:var(--panel); color:var(--muted); border:none; border-left:1px solid var(--line);
            padding:4px 11px; font-size:12px; line-height:1.2; cursor:pointer; font-family:inherit; }
  .segbtn:first-child { border-left:none; }
  .segbtn:hover { background:var(--btn); color:var(--ink); }
  .segbtn.active { background:var(--accent); color:#fff; }
  /* power-network SVG markers (divIcon) — drop Leaflet's default white box */
  .power-icon { background:none; border:none; }
  .power-icon svg { display:block; width:100%; height:100%;
    filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.55)); }
  .legend-ico { display:inline-block; width:15px; height:15px; margin-right:5px; vertical-align:-3px; }

  /* legend + layers (bottom-right Leaflet controls) */
  .legendbox { padding:8px 11px; font-size:12px; line-height:1.7; }
  .legendbox .swatch { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:7px; vertical-align:-1px; }
  /* one box, many sections: a section gets a top divider only when another
     visible section sits above it (toggled by refreshLegend) */
  .legsec.divided { border-top:1px solid var(--line); margin-top:7px; padding-top:7px; }
  .heatLegTitle { font-weight:600; margin-bottom:3px; }
  .grad { width:150px; height:10px; border-radius:3px;
          background:linear-gradient(to right, rgb(38,198,218), rgb(102,187,106), rgb(255,235,59), rgb(255,152,0), rgb(244,67,54), rgb(233,30,99)); }
  .gradlabels { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:2px; }
  .leaflet-control-layers { background:var(--panel)!important; color:var(--ink); border:1px solid var(--line)!important; border-radius:12px!important; }
  .leaflet-control-layers-expanded { padding:8px 10px!important; }
  .leaflet-control-layers label { font-size:12px; }
  .leaflet-bar a { background:var(--panel); color:var(--ink); border-bottom-color:var(--line); }
  .leaflet-bar a:hover { background:var(--btn); }
  .gh-bar { border:1px solid var(--line)!important; border-radius:12px!important; }
  .gh-link { display:flex!important; align-items:center; justify-content:center; width:36px!important; height:36px!important; border-radius:12px!important; border-bottom:none!important; color:var(--ink); }
  .leaflet-touch .gh-link { width:44px!important; height:44px!important; }   /* match the layers toggle on touch */
  #err { position:absolute; z-index:1200; top:50%; left:50%; transform:translate(-50%,-50%);
         padding:22px 26px; max-width:520px; display:none; line-height:1.5; }
  #err code { background:var(--btn); padding:2px 6px; border-radius:5px; color:#0c7a5d; }
  /* Popups inherit the theme so they match in dark mode. */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:var(--panel); color:var(--ink); }
  .leaflet-popup-content { font-size:13px; line-height:1.45; }
  .leaflet-popup-content b { color:var(--ink); }
  .leaflet-popup-content a { color:var(--planned); }
  .leaflet-container a.leaflet-popup-close-button { color:var(--muted); }
  .leaflet-control-attribution { background:var(--panel)!important; color:var(--muted)!important; }
  .leaflet-control-attribution a { color:var(--planned)!important; }
  /* spark cursor line — use themed ink so it stays visible on the dark map */
  #spark #cur { stroke:var(--ink); }
  .pill { display:inline-block; padding:1px 7px; border-radius:20px; font-size:11px; font-weight:600; color:#fff; }
  /* ---- Mobile: reclaim width, stop the fixed-height panel from clipping wrapped
         controls, and stack the time slider on its own full-width row. The
         offsetTop() JS re-measures the bar height on resize, so a taller/variable
         bar pushes the map controls down correctly. ---- */
  @media (max-width: 600px) {
    /* draw the map ~180px taller than the viewport so it fills behind iOS
       Safari's URL bar (and the gap that opens as the bar collapses on scroll) */
    :root { --mobile-browser-chrome-overscan:180px; }
    #controls { top:calc(6px + env(safe-area-inset-top, 0px));
                left:calc(6px + env(safe-area-inset-left, 0px));
                right:calc(6px + env(safe-area-inset-right, 0px));
                padding:8px 11px; gap:6px; }
    #title { font-size:13px; }
    /* stack the title/stat lines so changing playback numbers can't reflow the
       row and make the stats jump line-to-line; each sits on its own row */
    #topline { flex-direction:column; align-items:flex-start; gap:2px; }
    .stat { font-size:11px; }
    #liveStats { white-space:nowrap; }
    /* column layout kills the margin-left:auto, so pin the version to the
       panel's top-right corner where it lines up with the title row */
    .ver { position:absolute; top:8px; right:11px; margin:0; }
    /* let the time/heat panels grow with their content instead of clipping at 66px */
    #panelArea { height:auto; min-height:46px; }
    /* time row: play + label share line 1, slider/spark span the full width below */
    .timerow { flex-wrap:wrap; gap:6px 10px; }
    #tlabel { min-width:0; flex:1; text-align:left; }
    .timecol { order:3; flex-basis:100%; }
    /* heat row: stack each group on its own line so the segmented controls
       never overflow the viewport width */
    .heatrow { flex-direction:column; align-items:stretch; gap:8px; }
    .heatgroup { width:100%; }
    /* date range on its own full-width row: a grid lays the two pickers in equal
       columns (1fr) either side of the arrow. min-width:0 lets the native date
       inputs shrink below their content instead of overflowing the row. */
    .heatgroup:has(input[type=date]) { display:grid; grid-template-columns:auto 1fr auto 1fr; gap:7px; }
    .heatrow input[type=date], .daterange input[type=date] { min-width:0; }
    /* attribution: collapse behind an (i) badge so it doesn't eat two rows at the
       bottom of a phone. Tap the (i) to reveal the full credits (.attrib-open). */
    .leaflet-control-attribution.attrib-collapsible:not(.attrib-open) { font-size:0; padding:0; }
    .leaflet-control-attribution.attrib-collapsible:not(.attrib-open)::before {
      content:"\24D8"; font-size:16px; line-height:22px; display:block;
      width:22px; height:22px; text-align:center; color:var(--muted); cursor:pointer; }
    .leaflet-control-attribution.attrib-open { max-width:calc(100vw - 12px);
      font-size:10px; white-space:normal; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="controls" class="panel">
  <div id="topline">
    <span id="title">Lights Out</span>
    <span class="stat" id="lastScrape"></span>
    <span class="stat" id="src"></span>
    <!-- liveStats last: its numbers change while playing, so keep it at the end
         so nothing after it reflows -->
    <span class="stat" id="liveStats"><b id="n">0</b> active · <b id="cust">0</b> customers</span>
    <span class="ver">v1.5</span>
  </div>
  <div class="tabsrow">
    <div class="tabs">
      <button id="tabHeat" class="tab">Heatmap</button>
      <button id="tabTime" class="tab active">Time</button>
    </div>
    <!-- one date window, shared by Time + Heatmap; sits beside the tabs so it
         stays visible and in the same place in both modes -->
    <div class="heatgroup daterange">
      <span class="heatlbl">Range</span>
      <input type="date" id="heatStart" />
      <span class="heatarrow">→</span>
      <input type="date" id="heatEnd" />
    </div>
  </div>
  <div id="panelArea">
    <div class="timerow" id="panelTime">
      <button id="play" title="Play through time">▶</button>
      <div class="timecol">
        <input type="range" id="slider" min="0" max="1000" value="1000" />
        <svg id="spark" height="46"></svg>
        <span id="sparkcap">customers affected over time</span>
      </div>
      <span id="tlabel">—</span>
    </div>
    <div class="heatrow" id="panelHeat" style="display:none">
      <div class="heatgroup">
        <div class="seg" id="heatMetric" role="group" aria-label="Heatmap metric">
          <button type="button" class="segbtn active" data-metric="hours">Outage-hours</button>
          <button type="button" class="segbtn" data-metric="count">Count</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="err" class="panel"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/protomaps-leaflet@4.0.1/dist/protomaps-leaflet.js"></script>
<script>
// ---------- URL state (hash): center/zoom, mode, basemap, overlay toggles ----------
function parseHash(){
  const st = { overlays:new Set(), has: location.hash.length > 1 };
  for(const part of location.hash.replace(/^#/,"").split("&")){
    const [k,v] = part.split("=");
    if(k==="m" && v){ const [z,la,ln]=v.split("/").map(Number);
      if(!isNaN(z)&&!isNaN(la)&&!isNaN(ln)){ st.z=z; st.lat=la; st.lng=ln; } }
    else if(k==="v") st.mode=v;
    else if(k==="b") st.base=v;
    else if(k==="o" && v) v.split(",").forEach(x=>st.overlays.add(x));
  }
  return st;
}
const urlState = parseHash();
const overlayLayers = {};   // key -> layer, registered as overlays are created
let restoring = true;       // suppress hash writes until the initial state is applied

// ---------- base map + Leaflet controls (all at bottom) ----------
const map = L.map("map", { preferCanvas:true, zoomControl:false, attributionControl:false });
map.setView(urlState.z!=null ? [urlState.lat, urlState.lng] : [-31.95, 116.0],
            urlState.z!=null ? urlState.z : 8);

// Base street map auto-follows the OS theme: CARTO light_all in light mode,
// dark_all in dark mode. Same layer object so the layers control + URL state stay intact.
const darkMM = window.matchMedia("(prefers-color-scheme: dark)");
const cartoUrl = () => `https://{s}.basemaps.cartocdn.com/${darkMM.matches?"dark_all":"light_all"}/{z}/{x}/{y}{r}.png`;
const light = L.tileLayer(cartoUrl(), {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>', subdomains:"abcd", maxZoom:20 });
darkMM.addEventListener("change", () => light.setUrl(cartoUrl()));
const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  attribution:'Tiles &copy; <a href="https://www.esri.com">Esri</a> &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community', maxZoom:19 });
(urlState.base==="esri" ? esri : light).addTo(map);

function writeHash(){
  if(restoring) return;
  const c = map.getCenter();
  const parts = [
    `m=${map.getZoom()}/${c.lat.toFixed(4)}/${c.lng.toFixed(4)}`,
    `v=${heatActive?"heat":"time"}`,
    `b=${map.hasLayer(esri)?"esri":"light"}`,
  ];
  const on = Object.keys(overlayLayers).filter(k => map.hasLayer(overlayLayers[k]));
  if(on.length) parts.push("o="+on.join(","));
  history.replaceState(null, "", "#"+parts.join("&"));
}
map.on("moveend zoomend overlayadd overlayremove baselayerchange", writeHash);

L.control.zoom({ position:"topleft" }).addTo(map);
const attribCtrl = L.control.attribution({ position:"bottomleft",
  prefix:'Outage data &copy; <a href="https://www.westernpower.com.au">Western Power</a>' }).addTo(map);
// On mobile the attribution collapses behind an (i) badge (see CSS); tapping the
// badge reveals the credits, tapping the empty area collapses it again. Tapping a
// link (target is the <a>) is left alone so the links still work when expanded.
{
  const ac = attribCtrl.getContainer();
  ac.classList.add("attrib-collapsible");
  L.DomEvent.on(ac, "click", e => {
    if (e.target === ac) { ac.classList.toggle("attrib-open"); syncBottomControls(); }
  });
}

// Keep the bottom-right legend clear of the bottom-left attribution: if they
// would overlap horizontally (narrow screens / a wide expanded attribution),
// lift the legend by the attribution's height; otherwise drop it back down.
// Runs on load, on resize, and whenever the attribution (i) is toggled.
function syncBottomControls(){
  const attr  = document.querySelector(".leaflet-bottom.leaflet-left");
  const right = document.querySelector(".leaflet-bottom.leaflet-right");
  if(!attr || !right) return;
  right.style.marginBottom = "0";                 // measure the dropped-down position
  const a = attr.getBoundingClientRect(), r = right.getBoundingClientRect();
  const overlap = a.right > r.left && a.left < r.right;   // do their x-ranges intersect?
  if(overlap) right.style.marginBottom = (a.height + 6) + "px";
}

// The bottom-right legend is one box with several .legsec parts that show/hide
// with the mode and the GA layer toggles. Draw a divider above each visible
// section that has another visible section above it, then re-stack the box.
function refreshLegend(){
  if(!legendBoxEl) return;
  let prevVisible = false;
  for(const sec of legendBoxEl.querySelectorAll(".legsec")){
    const vis = sec.style.display !== "none" && sec.innerHTML.trim() !== "";
    sec.classList.toggle("divided", vis && prevVisible);
    if(vis) prevVisible = true;
  }
  syncBottomControls();
}

// Push the top map controls (zoom top-left, layers + GitHub top-right) below the
// top UI bar so they keep a CONSTANT gap from the bar's bottom edge — the bar's
// height changes between time/heatmap modes and on resize, so this is re-run on
// both. (Top-level so setMode() can call it on every mode switch.)
function offsetTop(){
  const bar = document.getElementById("controls");
  if(!bar) return;
  // use the bar's actual bottom (in viewport coords) so the gap stays constant
  // even when the bar is pushed down by env(safe-area-inset-top) on notched iOS
  const m = (Math.round(bar.getBoundingClientRect().bottom) + 8) + "px";
  document.querySelectorAll(".leaflet-top.leaflet-left,.leaflet-top.leaflet-right")
    .forEach(c => c.style.marginTop = m);
}
window.addEventListener("resize", syncBottomControls);

// Overture buildings overlay (vector PMTiles, streamed by HTTP range requests).
// protomaps-leaflet is a GridLayer (tile pane), so give it a pane ABOVE the
// opaque basemap or it draws underneath it. maxDataZoom:14 = the data's max
// zoom (tiles only exist to z14) so it overzooms instead of drawing blank.
map.createPane("buildingsPane");
map.getPane("buildingsPane").style.zIndex = 250;   // between tiles (200) and overlays (400)
let buildings = null;
try {
  buildings = protomapsL.leafletLayer({
    url: "https://overturemaps-extras-us-west-2.s3.us-west-2.amazonaws.com/tiles/2026-05-20.0/buildings.pmtiles",
    pane: "buildingsPane",
    maxDataZoom: 14,
    paintRules: [{
      dataLayer: "building",
      symbolizer: new protomapsL.PolygonSymbolizer({ fill:"#9aa3ad", opacity:0.45, stroke:"#444c56", width:1.2 })
    }],
    labelRules: [],
    attribution: 'Buildings &copy; <a href="https://overturemaps.org">Overture Maps</a> (&copy; OpenStreetMap contributors, Microsoft, Esri Community Maps, Google Open Buildings)'
  });
} catch (e) { console.warn("Overture layer unavailable:", e); }
if (buildings) overlayLayers["buildings"] = buildings;

// ---------- GA National Electricity Infrastructure overlay ----------
// WA transmission lines + substations + major power stations, pulled from
// Geoscience Australia's ArcGIS REST service as GeoJSON and styled client-side
// (so the voltage ramp + status rules below are fully ours). Each WA layer is
// well under the service's 2000-record cap, so a single STATE-filtered request
// per layer is enough — no paging. Lazy-loaded on first activation.
map.createPane("powerPane");
// Sit ABOVE the outage overlay (400). The map uses preferCanvas, so the outage
// layer is one full-viewport <canvas> in the overlayPane — if powerPane were
// below it that canvas would swallow every click before it reached the markers.
map.getPane("powerPane").style.zIndex = 450;   // above outages(400), below shadow(500)/markers(600)
const powerRenderer = L.canvas({ pane:"powerPane" });   // dedicated canvas so the lines draw + stay clickable in this pane
// Points (substations + stations) live in their OWN pane just above the lines
// pane, so they always render on top of the transmission lines.
map.createPane("powerPtsPane");
map.getPane("powerPtsPane").style.zIndex = 460;
const powerPtsRenderer = L.canvas({ pane:"powerPtsPane" });   // for the circle-marker fallbacks

const GA_BASE = "https://services.ga.gov.au/gis/rest/services/National_Electricity_Infrastructure/MapServer";
const gaUrl = (layer, fields) =>
  `${GA_BASE}/${layer}/query?where=${encodeURIComponent("STATE='Western Australia'")}` +
  `&outFields=${fields}&outSR=4326&f=geojson`;
const GA_ATTRIB = 'Power network &copy; <a href="https://www.ga.gov.au">Geoscience Australia</a>';

// kV -> colour ramp, shared by lines (CAPACITYKV) and substations (VOLTAGEKV)
const kvColor = kv =>
  kv >= 330 ? "#e4572e" :   // 330/500 kV — bulk transmission
  kv >= 220 ? "#f3a712" :   // 220/275 kV
  kv >= 132 ? "#ffd23f" :   // 132 kV
  kv >= 66  ? "#3fb950" :   // 66/88/110 kV — sub-transmission
  kv >   0  ? "#5b9bd5" :   // 11/22/33/44 kV — distribution
              "#8b98a5";    // unknown
const norm = s => (s || "").trim();
// NOTE: ArcGIS f=geojson output lowercases all field names, so properties are
// read as p.capacitykv / p.operationalstatus etc. (not the uppercase REST names).
const isOperational = p => norm(p.operationalstatus).toLowerCase() === "operational";
const gaEsc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
const powerRow = (k, v) => `<div><span style="color:var(--muted)">${k}:</span> ${v}</div>`;

// Custom SVG marker files (icons/), fetched once on first activation. The
// substation icon carries a __FILL__ token recoloured per voltage; the power
// station icon is sized by generation capacity. If the files haven't loaded yet
// (or the fetch failed) the points fall back to plain circle markers.
let subSvg = null, staSvg = null;
// Substations are drawn in a single colour — we don't differentiate by voltage.
const SUB_FILL = "#3fb950";
const subIcon = () => L.divIcon({ className:"power-icon",
  html: subSvg.replace(/__FILL__/g, SUB_FILL),
  iconSize:[19,19], iconAnchor:[9.5,9.5], popupAnchor:[0,-8] });
const staIcon = () => L.divIcon({ className:"power-icon", html: staSvg,
  iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-12] });

const powerLines = L.geoJSON(null, {
  pane: "powerPane", renderer: powerRenderer, attribution: GA_ATTRIB,
  style: f => {
    const kv = f.properties.capacitykv, op = isOperational(f.properties);
    return { color:kvColor(kv), weight: kv>=220?2.6 : kv>=132?2 : 1.4,
             opacity: op?0.9:0.5, dashArray: op?null:"4 4", lineCap:"round" };
  },
  onEachFeature: (f, l) => l.bindPopup(
    `<b>${gaEsc(norm(f.properties.name)) || "Transmission line"}</b>`
    + powerRow("Capacity", f.properties.capacitykv ? `${f.properties.capacitykv} kV` : "—")
    + powerRow("Class", gaEsc(norm(f.properties.class)) || "—")
    + powerRow("Status", gaEsc(norm(f.properties.operationalstatus)) || "—")),
});
const substations = L.geoJSON(null, {
  pane: "powerPane",
  pointToLayer: (f, ll) => subSvg
    ? L.marker(ll, { pane:"powerPtsPane", icon:subIcon(), keyboard:false })
    : L.circleMarker(ll, { pane:"powerPtsPane", renderer:powerPtsRenderer, radius:3.6, weight:1,
        color:"#0d1117", fillColor:SUB_FILL, fillOpacity:0.95 }),
  onEachFeature: (f, l) => l.bindPopup(
    `<b>${gaEsc(norm(f.properties.name)) || "Substation"}</b>`
    + powerRow("Voltage", f.properties.voltagekv ? `${f.properties.voltagekv} kV` : "—")
    + powerRow("Class", gaEsc(norm(f.properties.class)) || "—")
    + powerRow("Locality", gaEsc(norm(f.properties.locality)) || "—")
    + powerRow("Status", gaEsc(norm(f.properties.operationalstatus)) || "—")),
});
const powerStations = L.geoJSON(null, {
  pane: "powerPane",
  pointToLayer: (f, ll) => staSvg
    ? L.marker(ll, { pane:"powerPtsPane", icon:staIcon(), keyboard:false })
    : L.circleMarker(ll, { pane:"powerPtsPane", renderer:powerPtsRenderer, radius:6, weight:1.2,
        color:"#0d1117", fillColor:"#f5c518", fillOpacity:0.9 }),
  onEachFeature: (f, l) => { const mw = Number(f.properties.generationmw); l.bindPopup(
    `<b>${gaEsc(norm(f.properties.name)) || "Power station"}</b>`
    + powerRow("Capacity", isFinite(mw) && mw>0 ? `${mw.toLocaleString()} MW` : "—")
    + powerRow("Generation", gaEsc(norm(f.properties.generationtype)) || "—")
    + powerRow("Fuel", gaEsc(norm(f.properties.primaryfueltype)) || "—")
    + powerRow("Owner", gaEsc(norm(f.properties.owner)) || "—")
    + powerRow("Locality", gaEsc(norm(f.properties.locality)) || "—")); },
});

// Three independent overlays (each toggled + URL-persisted on its own).
overlayLayers["lines"]    = powerLines;
overlayLayers["subs"]     = substations;
overlayLayers["stations"] = powerStations;

// Marker SVGs are fetched once and shared by the substation + station layers.
// Bump ICON_VER whenever an icon file changes — the ?v= busts the browser cache
// (otherwise an updated icon would never reach a returning visitor).
const ICON_VER = "5";
let iconsPromise = null;
function ensureIcons(){
  if (!iconsPromise){
    const t = u => fetch(`${u}?v=${ICON_VER}`, {cache:"reload"}).then(r => r.ok ? r.text() : null).catch(() => null);
    iconsPromise = Promise.all([ t("icons/substation.svg"), t("icons/power-station.svg") ])
      .then(([s, p]) => { subSvg = s; staSvg = p; });
  }
  return iconsPromise;
}
const fetchLayer = (layer, fields, target) => fetch(gaUrl(layer, fields), {cache:"force-cache"})
  .then(r => r.ok ? r.json() : null)
  .then(g => { if (g && g.features) target.addData(g); })
  .catch(e => console.warn("GA power layer unavailable:", e));
// Lazy-load each layer's data the first time it is switched on. The point
// layers load their icons first so pointToLayer can use them (icons failing
// just falls back to circle markers, so the data loads either way).
const onceOnAdd = (layer, fn) => layer.on("add", function h(){ layer.off("add", h); fn(); });
onceOnAdd(powerLines, () =>
  fetchLayer(2, "NAME,CAPACITYKV,OPERATIONALSTATUS,CLASS,FEATURETYPE", powerLines));
onceOnAdd(substations, () => ensureIcons().finally(() =>
  fetchLayer(0, "NAME,VOLTAGEKV,OPERATIONALSTATUS,CLASS,LOCALITY", substations)));
onceOnAdd(powerStations, () => ensureIcons().finally(() =>
  fetchLayer(1, "NAME,GENERATIONMW,GENERATIONTYPE,PRIMARYFUELTYPE,OWNER,OPERATIONALSTATUS,LOCALITY", powerStations)));

// ---------- field accessors (events.geojson OR live current.geojson) ----------
const F = {
  ref:  p => p.incident_ref ?? p.INCIDENTREF ?? "?",
  type: p => p.outage_type ?? p.OUTAGETYPE ?? "",   // U=unplanned, F/P=scheduled
  cust: p => Number(p.max_customers_impacted ?? p.NOCUSTOMERSIMPACTED ?? 0) || 0,
  area: p => p.affected_area ?? p.AFFECTED_AREA ?? "",
  start: p => p.reported_start ?? p.OUTAGESTARTTIME ?? "",
  eta:  p => p.estimated_restoration ?? p.ESTIMATEDRESTORATIONTIME ?? "",
  first: p => p.first_seen_utc ? Date.parse(p.first_seen_utc) : null,
  last:  p => p.last_seen_utc  ? Date.parse(p.last_seen_utc)  : null,
  dur:  p => p.observed_duration_hours,
  snaps: p => p.snapshots_seen,
  aStart: p => p.active_start_utc ? Date.parse(p.active_start_utc) : F.first(p),
  aEnd:   p => p.active_end_utc ? Date.parse(p.active_end_utc) : F.last(p),
  stuck:  p => p.likely_stuck === true,
};
const isUnplanned = p => F.type(p) === "U";

const el = id => document.getElementById(id);
function showError(html){ const e=el("err"); e.innerHTML=html; e.style.display="block"; }

const style = unplanned => ({
  color: unplanned ? "#ff5a3c" : "#3b9dff",
  fillColor: unplanned ? "#ff5a3c" : "#3b9dff",
  weight:1, opacity:.9, fillOpacity:.30
});

function popup(p){
  const unplanned = isUnplanned(p);
  const label = unplanned ? "Unplanned" : (F.type(p)==="P" ? "Planned" : "Scheduled");
  const pill = `<span class="pill" style="background:${unplanned?'#ff5a3c':'#3b9dff'}">${label}</span>`;
  const rows = [
    [`<b>${F.ref(p)}</b>`, pill],
    ["Area", F.area(p) || "—"],
    ["Customers", F.cust(p).toLocaleString()],
    ["Reported start", F.start(p) || "—"],
    ["Est. restoration", F.eta(p) || "—"],
  ];
  if (F.aStart(p)!=null && F.aEnd(p)!=null){
    const h = Math.round((F.aEnd(p)-F.aStart(p))/3600000*10)/10;
    rows.push(["Active window", `<b>${new Date(F.aStart(p)).toLocaleString()} &rarr; ${new Date(F.aEnd(p)).toLocaleString()}</b> (${h} h)`]);
  }
  if (F.stuck(p)) rows.push(["⚠︎","stale record — end capped at frozen ETA"]);
  return rows.map(([k,v]) => k.startsWith("<b") ? `${k} ${v}` : `<div><span style="color:var(--muted)">${k}:</span> ${v}</div>`).join("");
}

// ---------- state ----------
let outageLayer, feats=[], tMin=null, tMax=null, temporal=false;
let series=[], sMax=1, playing=false, playTimer=null;
let heatFeatures=[], heatLayer=null, gridMap=null, heatTip=null;
let heatState=null, heatCells=null, heatMax=1, heatDLat=0, heatDLng=0;
let polyLegendEl=null, heatLegendEl=null, legendBoxEl=null;
const TOL = 5*60*1000;

// ---------- adaptive grid heatmap (cells scale with zoom: 10km -> 50m) ----------
const ring0 = g => g.type==="Polygon" ? g.coordinates[0] : g.coordinates[0][0];
function pointInPolygon(x,y,ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function heatRGBA(t,a){ // 0..1 -> teal -> green -> yellow -> orange -> red -> magenta
  const s=[[38,198,218],[102,187,106],[255,235,59],[255,152,0],[244,67,54],[233,30,99]];
  const n=s.length-1, x=Math.max(0,Math.min(1,t))*n, i=Math.min(n-1,Math.floor(x)), f=x-i;
  const c0=s[i], c1=s[i+1], m=j=>Math.round(c0[j]+(c1[j]-c0[j])*f);
  return `rgba(${m(0)},${m(1)},${m(2)},${a})`;
}
// date-only <input type="date"> helpers (local dates; end date is inclusive)
function toDateInput(ms){ const d=new Date(ms); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function dateToMs(val, endOfDay){ if(!val) return NaN; const [y,m,d]=val.split("-").map(Number); return new Date(y, m-1, d+(endOfDay?1:0)).getTime(); }

// cell size (km) by zoom; fixed reference latitude keeps the grid stable on pan
const HLAT = -32;
function cellKmForZoom(z){
  // 10x higher-res blocks (linear cell size / sqrt(10) => ~10x as many cells per area)
  if(z<=8) return 3.16;
  if(z===9) return 1.58;
  if(z===10) return 0.632;
  if(z===11) return 0.316;
  if(z===12) return 0.158;
  if(z===13) return 0.079;
  if(z===14) return 0.0316;
  return 0.0158;          // z >= 15 -> ~16m
}

// Full-viewport canvas overlay: re-bins only the visible area at the current
// zoom's cell size and redraws on move/zoom. Fill only, no cell borders.
const HeatLayer = L.Layer.extend({
  onAdd(map){
    this._map=map;
    // leaflet-zoom-animated => the canvas transform tweens with the zoom anim
    const c=this._canvas=L.DomUtil.create("canvas","leaflet-layer leaflet-zoom-animated");
    c.style.position="absolute"; c.style.pointerEvents="none"; c.style.transformOrigin="0 0";
    map.getPanes().overlayPane.appendChild(c);
    map.on("moveend zoomend resize", this._reset, this);
    if(map.options.zoomAnimation && L.Browser.any3d) map.on("zoomanim", this._animateZoom, this);
    this._reset();
    return this;
  },
  onRemove(map){
    map.off("moveend zoomend resize", this._reset, this);
    map.off("zoomanim", this._animateZoom, this);
    L.DomUtil.remove(this._canvas); this._canvas=null;
  },
  // scale the existing pixels to follow the zoom animation (no blank/blink);
  // _reset then redraws crisply at the new zoom's cell size on zoomend.
  // Uses the L.ImageOverlay approach: project the canvas's geographic bounds
  // to the target zoom (correct for zoom in AND out, with transform-origin 0 0).
  _animateZoom(e){
    const scale=this._map.getZoomScale(e.zoom);
    const offset=this._map._latLngBoundsToNewLayerBounds(this._bounds, e.zoom, e.center).min;
    L.DomUtil.setTransform(this._canvas, offset, scale);
  },
  _reset(){
    const map=this._map, size=map.getSize();
    this._bounds = map.getBounds();   // geographic area the canvas covers (for _animateZoom)
    // Double-buffer: build the new grid on an offscreen canvas first, so the
    // old grid stays on screen until the new one is fully rendered.
    recomputeHeat();
    const buf=this._buf||(this._buf=document.createElement("canvas"));
    buf.width=size.x; buf.height=size.y;
    drawHeat(buf.getContext("2d"));
    // now swap it in (only here does the visible canvas change)
    L.DomUtil.setPosition(this._canvas, map.containerPointToLayerPoint([0,0]));
    if(this._canvas.width!==size.x) this._canvas.width=size.x;
    if(this._canvas.height!==size.y) this._canvas.height=size.y;
    const ctx=this._canvas.getContext("2d");
    ctx.clearRect(0,0,size.x,size.y);
    ctx.drawImage(buf,0,0);
  }
});

// Bin features into a grid of cells sized by (dLat,dLng). `bounds` (optional)
// restricts binning to cells overlapping that area; pass null to bin the whole
// dataset. Returns a Map keyed "ix,iy" of {ix,iy,val}.
function binHeat(a,b,metric,dLat,dLng,bounds){
  let VX0=-Infinity,VX1=Infinity,VY0=-Infinity,VY1=Infinity;
  if(bounds){
    VX0=Math.floor(bounds.getWest()/dLng);  VX1=Math.floor(bounds.getEast()/dLng);
    VY0=Math.floor(bounds.getSouth()/dLat); VY1=Math.floor(bounds.getNorth()/dLat);
  }
  const grid=new Map();
  const bump=(ix,iy,w)=>{ const k=ix+","+iy,c=grid.get(k); if(c)c.val+=w; else grid.set(k,{ix,iy,val:w}); };
  for(const f of heatFeatures){
    const p=f.properties; let s=F.aStart(p), e=F.aEnd(p);
    if(s==null) continue; if(e==null||e<s) e=s;
    const ov=Math.max(0, Math.min(b,e)-Math.max(a,s)); if(ov<=0) continue;   // window overlap
    const w = metric==="count" ? 1 : ov/3600000;
    const ring=ring0(f.geometry);
    let mnX=Infinity,mnY=Infinity,mxX=-Infinity,mxY=-Infinity,cx=0,cy=0;
    for(const [lng,lat] of ring){ if(lng<mnX)mnX=lng;if(lng>mxX)mxX=lng;if(lat<mnY)mnY=lat;if(lat>mxY)mxY=lat;cx+=lng;cy+=lat; }
    const ix0=Math.max(VX0,Math.floor(mnX/dLng)), ix1=Math.min(VX1,Math.floor(mxX/dLng));
    const iy0=Math.max(VY0,Math.floor(mnY/dLat)), iy1=Math.min(VY1,Math.floor(mxY/dLat));
    let any=false;
    for(let ix=ix0;ix<=ix1;ix++) for(let iy=iy0;iy<=iy1;iy++)
      if(pointInPolygon((ix+0.5)*dLng,(iy+0.5)*dLat,ring)){ bump(ix,iy,w); any=true; }
    if(!any){   // polygon smaller than a cell -> its centroid cell (if in bounds)
      const gx=Math.floor((cx/ring.length)/dLng), gy=Math.floor((cy/ring.length)/dLat);
      if(gx>=VX0&&gx<=VX1&&gy>=VY0&&gy<=VY1) bump(gx,gy,w);
    }
  }
  return grid;
}

// Static color-scale max for a given cell size: the peak per-cell value across
// the WHOLE dataset (not the viewport). Computed once per cell size + window +
// metric and cached on heatState, so panning never rescales the colors — the
// max only changes when the zoom's cell size (or the heat settings) changes.
// Scanning the whole dataset at a deep-zoom cell size is catastrophic: a single
// state-wide polygon spans millions of 50m cells, each point-in-polygon tested.
// But the peak per-cell value barely changes once cells get smaller than the
// outage polygons themselves (a cell's value ≈ how many polygons overlap that
// point — a property of location, not cell size). So we never scan finer than
// HEAT_MAX_SCAN_KM and reuse that result for every deeper zoom. Coarse zooms,
// where small polygons merge into one cell and the max genuinely rises, still
// get their own exact value.
const HEAT_MAX_SCAN_KM = 2;
function staticHeatMax(km){
  const {a,b,metric,maxCache}=heatState;
  const sk=Math.max(km,HEAT_MAX_SCAN_KM);     // floor the scan resolution
  if(maxCache.has(sk)) return maxCache.get(sk);
  const dLat=sk/110.574, dLng=sk/(111.320*Math.cos(HLAT*Math.PI/180));
  let mx=0; for(const c of binHeat(a,b,metric,dLat,dLng,null).values()) if(c.val>mx) mx=c.val;
  const v=Math.max(1,mx); maxCache.set(sk,v); return v;
}

function recomputeHeat(){
  if(!heatState){ heatCells=null; return; }
  const {a,b,metric}=heatState;
  const km=cellKmForZoom(map.getZoom());
  heatDLat = km/110.574;
  heatDLng = km/(111.320*Math.cos(HLAT*Math.PI/180));
  const vb=map.getBounds().pad(0.15);     // only bin cells in (slightly padded) view
  gridMap=binHeat(a,b,metric,heatDLat,heatDLng,vb); heatCells=[...gridMap.values()];
  heatMax=staticHeatMax(km);              // static scale from the full dataset, not the view
  if(heatLegendEl){
    el("heatLegTitle").textContent = metric==="count" ? "Outages per cell" : "Outage-hours per cell";
    el("heatLegMax").textContent = metric==="count" ? Math.round(heatMax) : `${Math.round(heatMax)}h`;
  }
}

function drawHeat(ctx){
  if(!heatCells) return;
  ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
  for(const c of heatCells){
    const tl=map.latLngToContainerPoint([(c.iy+1)*heatDLat, c.ix*heatDLng]);
    const br=map.latLngToContainerPoint([c.iy*heatDLat, (c.ix+1)*heatDLng]);
    // log-normalize so a few outlier cells don't crush everything else to the low end
    const t=Math.log1p(c.val)/Math.log1p(heatMax);
    ctx.fillStyle=heatRGBA(t, 0.25+0.55*t);
    ctx.fillRect(tl.x, tl.y, Math.ceil(br.x-tl.x)+1, Math.ceil(br.y-tl.y)+1);   // +1 avoids seams
  }
}

// Time / Heatmap are mutually exclusive, switched by the tabs. The panel area is
// a fixed height so the top bar never resizes when switching.
let heatActive=false;
function setMode(m){
  heatActive = (m==="heat");
  el("tabTime").classList.toggle("active", !heatActive);
  el("tabHeat").classList.toggle("active", heatActive);
  el("panelTime").style.display = heatActive ? "none" : "flex";
  el("panelHeat").style.display = heatActive ? "flex" : "none";
  // the "N active @ time" stats only make sense for the timeline
  el("liveStats").style.display = heatActive ? "none" : "";
  if(outageLayer){
    if(!heatActive && !map.hasLayer(outageLayer)) outageLayer.addTo(map);
    else if(heatActive && map.hasLayer(outageLayer)) map.removeLayer(outageLayer);
  }
  if(polyLegendEl) polyLegendEl.style.display = heatActive ? "none" : "";
  if(heatLegendEl) heatLegendEl.style.display = heatActive ? "" : "none";
  if(heatActive){ setPlaying(false); computeHeat(); }
  else {   // entering the timeline: rebuild for the current date range, then redraw
    removeHeat();
    if(temporal){ buildSeries(); drawSpark(); setPlaying(true); }
    render();
  }
  // the bar's height differs between modes — re-offset the map controls so they
  // keep a constant gap from the bar, and re-flow the legend (dividers + stack)
  offsetTop(); refreshLegend();
  writeHash();
}
function removeHeat(){
  if(heatLayer && map.hasLayer(heatLayer)) map.removeLayer(heatLayer);
  heatState=null; gridMap=null;
}
function computeHeat(){            // (re)build the heatmap from the current heat settings
  const a=dateToMs(el("heatStart").value,false), b=dateToMs(el("heatEnd").value,true);
  if(isNaN(a)||isNaN(b)||b<=a){ removeHeat(); return; }
  const metric=currentMetric();
  let nOut=0;                                        // outages overlapping the window
  for(const f of heatFeatures){
    const p=f.properties; let s=F.aStart(p), e=F.aEnd(p);
    if(s==null) continue; if(e==null||e<s) e=s;
    const ov=Math.max(0, Math.min(b,e)-Math.max(a,s)); if(ov<=0) continue;
    nOut++;
  }
  if(!nOut){ removeHeat(); return; }   // nothing in range — clear the layer
  heatState = { a, b, metric, maxCache: new Map() };
  if(!heatLayer) heatLayer=new HeatLayer();
  if(!map.hasLayer(heatLayer)) heatLayer.addTo(map); else heatLayer._reset();
}

function activeAt(p, t){
  let a=F.aStart(p), b=F.aEnd(p);
  if (a==null) return true;
  if (b==null || b<a) b=a;
  return a-TOL <= t && t <= b+TOL;
}
// The timeline shares the heatmap's date range: the slider + sparkline span
// [heatStart, heatEnd], falling back to the full data domain if it's unset/invalid.
function winRange(){
  const a=dateToMs(el("heatStart").value,false), b=dateToMs(el("heatEnd").value,true);
  return (!isNaN(a) && !isNaN(b) && b>a) ? [a,b] : [tMin,tMax];
}
function curT(){ if(tMin==null) return null; const [a,b]=winRange(); return a + (b-a) * (el("slider").value/1000); }

const fmt = t => new Date(t).toLocaleString([], {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});

// "last scrape <time> (N min ago)" — ticks on its own so the relative bit stays live
let lastScrapeMs = null;
function ago(ms){
  const m = Math.round((Date.now()-ms)/60000);
  if (m < 1)  return "just now";
  if (m < 60) return `${m} min ago`;
  const h = Math.floor(m/60);
  if (h < 24) return `${h}h ${m%60}m ago`;
  return `${Math.floor(h/24)}d ago`;
}
function updateLastScrape(){
  if (lastScrapeMs!=null) el("lastScrape").textContent = `last scrape ${fmt(lastScrapeMs)} (${ago(lastScrapeMs)})`;
}
setInterval(updateLastScrape, 30000);

function render(){
  const t = curT();
  let n=0, cust=0;
  outageLayer.eachLayer(l=>{
    const p=l.feature.properties;
    const vis = activeAt(p, t);
    l.setStyle({ ...style(isUnplanned(p)), opacity: vis?0.9:0, fillOpacity: vis?0.30:0 });
    if (l._path) l._path.style.pointerEvents = vis ? "auto" : "none";
    if (vis){ n++; cust += F.cust(p); }
  });
  el("n").textContent = n.toLocaleString();
  el("cust").textContent = cust.toLocaleString();
  if (t!=null){ el("tlabel").textContent = fmt(t); }
  drawCursor();
}

// ---------- sparkline: total customers affected over time ----------
function buildSeries(){
  const S = 320;
  const items = feats.map(p => [F.aStart(p), F.aEnd(p), F.cust(p)])
                     .filter(([a,b]) => a!=null);
  series = [];
  let peakN = 0;
  const [wa,wb] = winRange();   // span the shared heatmap date range
  for (let i=0;i<S;i++){
    const t = wa + (wb-wa)*i/(S-1);
    let c=0, n=0;
    for (const [a,b,cust] of items){ const bb=(b==null||b<a)?a:b; if (a-TOL<=t && t<=bb+TOL){ c+=cust; n++; } }
    series.push(c);
    if (n>peakN) peakN = n;
  }
  sMax = Math.max(1, ...series);
  // reserve each live counter's width for the dataset's peak value so the line
  // doesn't reflow as the numbers tick during playback
  el("n").style.minWidth    = `${peakN.toLocaleString().length}ch`;
  el("cust").style.minWidth = `${sMax.toLocaleString().length}ch`;
}
// PAD_X = half the 14px slider thumb. The thumb centre travels [PAD_X, W-PAD_X],
// so we plot the sparkline and cursor over the same range to line them up.
const PAD_X = 7;
const sparkW = () => el("spark").clientWidth || 1000;
function drawSpark(){
  const svg = el("spark"), W=sparkW(), H=46, padT=4, P=PAD_X;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "none");
  const x = i => P + i/(series.length-1)*(W-2*P);
  const y = c => H - (c/sMax)*(H-padT);
  const line="M"+series.map((c,i)=>`${x(i).toFixed(1)},${y(c).toFixed(1)}`).join(" L");
  const area=line+` L${(W-P).toFixed(1)},${H} L${P},${H} Z`;
  svg.innerHTML =
    `<path d="${area}" fill="#0f9d7722" stroke="none"/>`+
    `<path d="${line}" fill="none" stroke="#0f9d77" stroke-width="1.4"/>`+
    `<line id="cur" x1="0" y1="0" x2="0" y2="${H}" stroke="#1a2230" stroke-width="1" opacity="0.6"/>`;
  el("sparkcap").textContent = `customers affected over time · peak ${sMax.toLocaleString()}`;
  drawCursor();
}
function drawCursor(){
  const cur=document.getElementById("cur"); if(!cur) return;
  const W=sparkW(), P=PAD_X, xv = P + (el("slider").value/1000)*(W-2*P);
  cur.setAttribute("x1",xv); cur.setAttribute("x2",xv);
}

// ---------- load + build ----------
// Populate / refresh the data-dependent layers. firstTime=true does the initial
// setup (creates outageLayer, fits bounds, sets defaults); firstTime=false
// refreshes in place — keeping the current view, mode, and date selection.
function applyData(geo, firstTime){
  feats = geo.features.map(f=>f.properties).filter((p,i)=>geo.features[i].geometry && !F.stuck(p));
  const shown = { type:"FeatureCollection",
                  features: geo.features.filter(f=>f.geometry && !F.stuck(f.properties)) };
  heatFeatures = shown.features;   // full features (geometry+props) for the grid
  el("src").textContent = `dataset contains ${shown.features.length.toLocaleString()} outages`;
  // last scrape time: from the build stamp, else newest last-seen in the data
  const gen = geo.generated_utc ? Date.parse(geo.generated_utc)
            : Math.max(0, ...feats.map(F.last).filter(v=>v!=null));
  if (gen){ lastScrapeMs = gen; updateLastScrape(); }

  if (firstTime){
    outageLayer = L.geoJSON(shown, {
      style: f => style(isUnplanned(f.properties)),
      onEachFeature: (f,l) => l.bindPopup(popup(f.properties))
    }).addTo(map);
    if (urlState.z==null) { try { map.fitBounds(outageLayer.getBounds(), { padding:[40,40], animate:false }); } catch(e){} }
  } else {
    outageLayer.clearLayers(); outageLayer.addData(shown);   // in-place, keep the view
  }

  // time domain from active windows (includes future planned works)
  const starts = feats.map(F.aStart).filter(v=>v!=null);
  const ends   = feats.map(F.aEnd).filter(v=>v!=null);
  const seen   = feats.map(F.first).filter(v=>v!=null);   // when each outage was first observed
  if (starts.length){
    temporal=true;
    // The dataset only has information from the first snapshot onward, so don't let
    // a few stale records' pre-observation reported starts drag the timeline back
    // (e.g. a "likely_stuck" outage reported May 31 but first seen June 9). Floor
    // tMin at the earliest observation time.
    const obsStart = seen.length ? Math.min(...seen) : Math.min(...starts);
    tMin = Math.max(Math.min(...starts), obsStart);
    tMax = Math.max(...ends, ...starts);
    if (tMax>tMin){
      if (firstTime) el("slider").value = 0;   // start at the beginning of the dataset
      buildSeries(); drawSpark();
      requestAnimationFrame(drawSpark);
      // bound the shared picker to the data domain so you can't go before/after the data
      const dmin = toDateInput(tMin), dmax = toDateInput(tMax);
      el("heatStart").min = el("heatEnd").min = dmin;
      el("heatStart").max = el("heatEnd").max = dmax;
      if (firstTime){   // default the window to the full domain (keep a user's choice on refresh)
        el("heatStart").value = dmin;
        el("heatEnd").value   = dmax;
      }
    }
  }

  if (!firstTime){ if (heatActive) computeHeat(); else render(); }   // re-render with new data
}

function build(geo){
  applyData(geo, true);

  // layers control + legend (bottom-right), created now that outageLayer exists
  const overlays = {};
  if (buildings) overlays["Buildings (Overture)"] = buildings;
  overlays["Transmission lines (GA)"] = powerLines;
  overlays["Substations (GA)"]        = substations;
  overlays["Power stations (GA)"]     = powerStations;
  const layersCtrl = L.control.layers({ "Street":light, "Satellite (Esri)":esri }, overlays,
                   { position:"topright", collapsed:true }).addTo(map);

  // restore overlay toggles from the URL, else defaults (buildings on; SWIS is
  // always on; the GA power layers are off by default so the outage view stays clean)
  if (buildings && (urlState.has ? urlState.overlays.has("buildings") : true)) buildings.addTo(map);
  if (urlState.has){
    if (urlState.overlays.has("lines"))    powerLines.addTo(map);
    if (urlState.overlays.has("subs"))     substations.addTo(map);
    if (urlState.overlays.has("stations")) powerStations.addTo(map);
  }

  // GitHub source link, stacked under the layers menu (top-right)
  const ghCtrl = L.control({ position:"topright" });
  ghCtrl.onAdd = () => {
    const bar = L.DomUtil.create("div", "leaflet-bar gh-bar");
    const a = L.DomUtil.create("a", "gh-link", bar);
    a.href = "https://github.com/wrignj08/lights-out";
    a.target = "_blank"; a.rel = "noopener"; a.title = "View source on GitHub";
    a.innerHTML = `<svg viewBox="0 0 16 16" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 012-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>`;
    L.DomEvent.disableClickPropagation(a);
    return bar;
  };
  ghCtrl.addTo(map);

  // approximate SWIS extent (derived from Western Power network) — faint outline
  fetch("data/swis_boundary.geojson", {cache:"no-store"}).then(r=>r.ok?r.json():null).then(geo=>{
    if(!geo) return;
    const swis = L.geoJSON(geo, { interactive:false, style:{
      color:"#5b6b7c", weight:1.5, opacity:0.85, dashArray:"5 4", fill:false } });
    // always on — not a URL toggle and not in the layers menu
    swis.addTo(map); swis.bringToBack();
  }).catch(()=>{});

  // Push the top controls below the bar now and after first paint (offsetTop and
  // syncBottomControls are top-level; setMode also calls them on each mode switch).
  offsetTop(); requestAnimationFrame(offsetTop);
  window.addEventListener("resize", offsetTop);

  const legend = L.control({ position:"bottomright" });
  legend.onAdd = () => {
    // One box; each part is a .legsec that shows/hides so the box grows and
    // shrinks as modes switch and layers toggle (refreshLegend draws dividers).
    const wrap = L.DomUtil.create("div","panel legendbox");
    legendBoxEl = wrap;
    polyLegendEl = L.DomUtil.create("div","legsec", wrap);
    polyLegendEl.innerHTML = `<div><span class="swatch" style="background:#ff5a3c"></span>Unplanned outage</div>
                   <div><span class="swatch" style="background:#3b9dff"></span>Scheduled work</div>`;
    heatLegendEl = L.DomUtil.create("div","legsec", wrap);
    heatLegendEl.style.display="none";
    heatLegendEl.innerHTML = `<div class="heatLegTitle" id="heatLegTitle">Outage-hours per cell</div>
                   <div class="grad"></div>
                   <div class="gradlabels"><span>0</span><span id="heatLegMax">—</span></div>`;
    // SWIS row stays visible in both time + heatmap modes
    const swisLegendEl = L.DomUtil.create("div","legsec", wrap);
    swisLegendEl.innerHTML = `<div><span class="swatch" style="background:transparent;border:1.5px dashed #5b6b7c"></span>SWIS extent (approx.)</div>`;
    // Power-network key — rows appear only for the GA layers currently switched
    // on. The voltage ramp covers transmission lines + substations; the station
    // glyph mirrors the custom marker SVG.
    const powerLegendEl = L.DomUtil.create("div","legsec", wrap);
    const voltRows =
      `<div style="font-weight:600;margin-bottom:2px">Voltage (lines)</div>`
      + `<div><span class="swatch" style="background:#e4572e"></span>330 kV +</div>`
      + `<div><span class="swatch" style="background:#f3a712"></span>220–275 kV</div>`
      + `<div><span class="swatch" style="background:#ffd23f"></span>132 kV</div>`
      + `<div><span class="swatch" style="background:#3fb950"></span>66–110 kV</div>`
      + `<div><span class="swatch" style="background:#5b9bd5"></span>&lt; 66 kV</div>`;
    const subRow =
      `<div style="margin-top:3px"><span class="legend-ico"><svg viewBox="0 0 24 24">`
      + `<rect x="3" y="3" width="18" height="18" rx="4.5" fill="#3fb950" stroke="#0d1117" stroke-width="1.6" paint-order="stroke"/>`
      + `<path d="M13.4 5.4 L7.4 13.3 h3.5 l-1.6 5.3 6.3-7.9 h-3.6 z" fill="#fff" stroke="#0d1117" stroke-width="0.5" stroke-linejoin="round"/>`
      + `</svg></span>Substation</div>`;
    const stationRow =
      `<div style="margin-top:3px"><span class="legend-ico"><svg viewBox="0 0 24 24">`
      + `<rect x="3" y="3" width="18" height="18" rx="4.5" fill="#f5c518" stroke="#0d1117" stroke-width="1.6" paint-order="stroke"/>`
      + `<path d="M13.4 5.4 L7.4 13.3 h3.5 l-1.6 5.3 6.3-7.9 h-3.6 z" fill="#fff" stroke="#0d1117" stroke-width="0.5" stroke-linejoin="round"/>`
      + `</svg></span>Power station</div>`;
    function syncPowerLegend(){
      const volt = map.hasLayer(powerLines);
      const sub  = map.hasLayer(substations);
      const sta  = map.hasLayer(powerStations);
      powerLegendEl.innerHTML = (volt ? voltRows : "") + (sub ? subRow : "") + (sta ? stationRow : "");
      powerLegendEl.style.display = (volt || sub || sta) ? "" : "none";
      refreshLegend();
    }
    [powerLines, substations, powerStations].forEach(l => {
      l.on("add", syncPowerLegend); l.on("remove", syncPowerLegend); });
    syncPowerLegend();
    return wrap;
  };
  legend.addTo(map);
  syncBottomControls();   // lift the legend above the attribution

  setMode(urlState.has && urlState.mode ? urlState.mode : "heat");   // restore mode, else heatmap
  restoring = false;   // initial state applied — hash writes can begin
  writeHash();
  startAutoRefresh();
}

// Poll for a newer events.geojson (the workflow redeploys every ~10 min) and
// update the map in place when it changes — no page reload, view preserved.
function startAutoRefresh(){
  const URL = "data/events.geojson";
  let stamp = null, busy = false;
  async function check(){
    if (document.hidden || busy) return;
    busy = true;
    try {
      const h = await fetch(URL, {method:"HEAD", cache:"no-store"});
      const s = h.headers.get("etag") || h.headers.get("last-modified");
      if (s){
        if (stamp == null) stamp = s;                 // first observation
        else if (s !== stamp){                        // new deploy -> pull + apply in place
          const r = await fetch(URL, {cache:"no-store"});
          if (r.ok){
            const geo = await r.json();
            if (geo.features && geo.features.length){ stamp = s; applyData(geo, false); }
          }
        }
      }
    } catch(e){} finally { busy = false; }
  }
  check();
  setInterval(check, 90*1000);
  // timers freeze in a backgrounded tab, so also check the moment it regains focus
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
  window.addEventListener("focus", check);
}

el("slider").oninput = render;
function setPlaying(on){
  playing = on;
  el("play").textContent = playing ? "⏸" : "▶";
  clearInterval(playTimer);
  if (playing){
    playTimer = setInterval(()=>{
      let v=+el("slider").value+6; if(v>=1000) v=0;
      el("slider").value=v; render();
    }, 110);
  }
}
el("play").onclick = () => setPlaying(!playing);
// click the sparkline to seek (same inset as the slider thumb travel)
el("spark").addEventListener("click", e=>{
  const r=el("spark").getBoundingClientRect();
  const f=Math.min(1,Math.max(0,(e.clientX-r.left-PAD_X)/(r.width-2*PAD_X)));
  el("slider").value=Math.round(f*1000);
  render();
});
window.addEventListener("resize", ()=>{ if(temporal) drawSpark(); });

// mode tabs (mutually exclusive) + live heatmap controls (no Apply button)
el("tabTime").onclick = () => setMode("time");
el("tabHeat").onclick = () => setMode("heat");

// --- heatmap metric toggle (segmented control) ---
const metricBtns = [...document.querySelectorAll("#heatMetric .segbtn")];
function currentMetric(){ return (document.querySelector("#heatMetric .segbtn.active")||{}).dataset?.metric || "hours"; }
metricBtns.forEach(b => b.onclick = () => {
  metricBtns.forEach(x => x.classList.toggle("active", x===b));
  if(heatActive) computeHeat();
});

// One shared date window drives both modes; on change, keep the timeline's
// slider/sparkline in sync and re-render whichever view is active.
function rangeChanged(){
  if(temporal){ buildSeries(); drawSpark(); }
  if(heatActive) computeHeat(); else render();
}
el("heatStart").onchange = rangeChanged;
el("heatEnd").onchange   = rangeChanged;

// readout over heat cells: follows the cursor on desktop (hover), and stays put
// on touch where a tap is the only "hover" you get.
heatTip = L.tooltip({ sticky:true, direction:"top", offset:[0,-2] });
function showHeatTip(latlng){
  if(!heatLayer || !map.hasLayer(heatLayer) || !gridMap){ return false; }
  const ix=Math.floor(latlng.lng/heatDLng), iy=Math.floor(latlng.lat/heatDLat);
  const c=gridMap.get(ix+","+iy);
  if(!c){ if(map.hasLayer(heatTip)) map.removeLayer(heatTip); return false; }
  heatTip.setLatLng(latlng).setContent(
    heatState.metric==="count" ? `${c.val} outage${c.val>1?"s":""}` : `${c.val.toFixed(1)} outage-hours`);
  if(!map.hasLayer(heatTip)) heatTip.addTo(map);
  return true;
}
// Desktop hover. On touch a tap emits a synthetic mousemove that would flash the
// tip and then vanish, so ignore mousemove there and rely on click instead.
map.on("mousemove", e=>{ if(!L.Browser.touch) showHeatTip(e.latlng); });
map.on("mouseout", ()=>{ if(!L.Browser.touch && heatTip && map.hasLayer(heatTip)) map.removeLayer(heatTip); });
// Tap a cell to pin its readout; tap an empty area (or non-heat mode) to dismiss.
map.on("click", e=>{
  if(!heatLayer || !map.hasLayer(heatLayer) || !gridMap){ return; }
  showHeatTip(e.latlng);   // showHeatTip removes the tip itself when the cell is empty
});

async function load(){
  for (const url of ["data/events.geojson","data/current.geojson"]){
    try {
      const r = await fetch(url, {cache:"no-store"});
      if (!r.ok) continue;
      const geo = await r.json();
      if (geo.features && geo.features.length){ build(geo); return; }
    } catch(e){ /* try next */ }
  }
  showError(`<b>Couldn't load outage data.</b><br><br>
    Browsers block <code>file://</code> pages from reading local files, so serve
    this map locally:<br><br>
    <code>cd ~/Documents/Projects/Power\\ history</code><br>
    <code>python3 -m http.server 8000</code><br><br>
    then visit <code>http://localhost:8000/map.html</code>.<br><br>
    Also generate the data first: <code>python3 build_events.py</code>.`);
}
load();
</script>
